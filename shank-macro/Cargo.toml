[package]
name = "swig-shank-macro"
version = "0.4.2"
description = "Provides macros used to annotate Solana Rust programs in order to extract an IDL with the shank CLI"
authors = ["Metaplex Maintainers <maintainers@metaplex.com>"]
repository = "https://github.com/anagrambuild/shank"
license = "Apache-2.0"
edition = "2018"

[lib]
proc-macro = true
doctest = false

[dependencies]
proc-macro2 = "1.0.32"
quote = "1.0.10"
shank_macro_impl = "=0.4.2"
shank_render = { package = "swig-shank-render", version = "=0.4.2", path = "../shank-render" }
syn = "1.0.82"

[dev-dependencies]
pinocchio = "0.9"
